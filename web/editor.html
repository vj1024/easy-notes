<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EasyNotes</title>
    <link rel="icon" href="/favicon.ico">
    <link rel="stylesheet" href="/assets/vendor/jstree/themes/default/style.min.css">
    <link rel="stylesheet" href="/assets/vendor/vditor/dist/index.css">
    <link rel="stylesheet" href="/assets/css/editor.css">
</head>
<body>

<button class="mobile-toggle" id="mobile-toggle">📂</button>
<div class="overlay-backdrop" id="overlay-backdrop"></div>

<div class="app">
    <!-- 侧边栏 -->
    <div class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <div class="sidebar-brand">
                <div class="sidebar-brand-left">
                    <div class="sidebar-brand-logo">📝</div>
                    <div class="sidebar-brand-name">EasyNotes</div>
                </div>
                <button class="theme-toggle" id="theme-toggle" title="切换主题 (亮/暗/自动)">☀</button>
            </div>
            <div class="sidebar-actions">
                <button class="action-btn" id="btn-new-file" title="新建文件">
                    <span class="icon">+</span> 文件
                </button>
                <button class="action-btn" id="btn-new-folder" title="新建文件夹">
                    <span class="icon">+</span> 文件夹
                </button>
                <button class="action-btn danger" id="btn-delete" title="删除">
                    <span class="icon">🗑</span>
                </button>
            </div>
            <div class="search-box">
                <div class="search-input-wrap">
                    <span class="search-icon">🔍</span>
                    <input type="text" class="search-input" id="search-input" placeholder="搜索文件名，/ 开头搜索内容...">
                </div>
            </div>
            <div class="search-stats" id="search-stats"></div>
        </div>
        <div id="file-tree">
            <div class="loading">加载文件树...</div>
        </div>
        <div class="resize-handle" id="resize-handle"></div>
    </div>

    <!-- 编辑器 -->
    <div class="editor-area">
        <div class="editor-topbar" id="editor-topbar">
            <div class="editor-topbar-left">
                <div class="breadcrumb" id="breadcrumb">
                    <span class="current">EasyNotes</span>
                </div>
            </div>
            <div class="save-indicator" id="save-indicator"></div>
        </div>
        <div class="editor-content">
            <div id="vditor-container">
                <div class="empty-state">
                    <div class="empty-state-icon">📝</div>
                    <h3>选择文件开始编辑</h3>
                    <p>从左侧选择一个文件，或创建新文件</p>
                </div>
            </div>
        </div>
        <div class="status-bar" id="status-bar">
            <div id="status-left">就绪</div>
            <div id="status-right"></div>
        </div>
    </div>
</div>

<!-- 右键菜单 -->
<div class="context-menu" id="context-menu">
    <div id="ctx-folder-items" style="display:none">
        <div class="ctx-item" data-action="new-file">📄 新建文件</div>
        <div class="ctx-item" data-action="new-folder">📁 新建文件夹</div>
        <div class="ctx-divider"></div>
    </div>
    <div class="ctx-item" data-action="rename">✏️ 重命名</div>
    <div class="ctx-item danger" data-action="delete">🗑 删除</div>
</div>

<!-- 新建文件弹窗 -->
<div class="modal-overlay" id="modal-new-file">
    <div class="modal">
        <h3>新建文件</h3>
        <input type="text" id="input-new-file" placeholder="输入文件名，如 notes.md" autocomplete="off">
        <div class="modal-actions">
            <button class="btn-cancel" onclick="closeModal('modal-new-file')">取消</button>
            <button class="btn-confirm" id="btn-confirm-new-file">创建</button>
        </div>
    </div>
</div>

<!-- 新建文件夹弹窗 -->
<div class="modal-overlay" id="modal-new-folder">
    <div class="modal">
        <h3>新建文件夹</h3>
        <input type="text" id="input-new-folder" placeholder="输入文件夹名" autocomplete="off">
        <div class="modal-actions">
            <button class="btn-cancel" onclick="closeModal('modal-new-folder')">取消</button>
            <button class="btn-confirm" id="btn-confirm-new-folder">创建</button>
        </div>
    </div>
</div>

<!-- 重命名弹窗 -->
<div class="modal-overlay" id="modal-rename">
    <div class="modal">
        <h3>重命名</h3>
        <input type="text" id="input-rename" placeholder="输入新名称" autocomplete="off">
        <div class="modal-actions">
            <button class="btn-cancel" onclick="closeModal('modal-rename')">取消</button>
            <button class="btn-confirm" id="btn-confirm-rename">确定</button>
        </div>
    </div>
</div>

<!-- 删除确认弹窗 -->
<div class="modal-overlay" id="modal-delete">
    <div class="modal">
        <h3>确认删除</h3>
        <p class="delete-message" id="delete-message"></p>
        <div class="modal-actions">
            <button class="btn-cancel" onclick="closeModal('modal-delete')">取消</button>
            <button class="btn-danger-confirm" id="btn-confirm-delete">删除</button>
        </div>
    </div>
</div>

<script src="/assets/vendor/jquery/jquery.min.js"></script>
<script src="/assets/vendor/jstree/jstree.min.js"></script>
<script src="/assets/vendor/vditor/dist/index.min.js"></script>
<script src="/assets/vendor/ace/ace.js"></script>
<script src="/assets/vendor/ace/ext-modelist.js"></script>
<script src="/assets/js/editor.js"></script>
</body>
</html>
