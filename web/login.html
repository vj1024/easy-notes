<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EasyNotes - 登录</title>
    <link rel="icon" href="/favicon.ico">
    <link rel="manifest" href="/manifest.webmanifest">
    <meta name="theme-color" content="#5645d4">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <link rel="stylesheet" href="/assets/css/login.css">
    <script>
        // 主题初始化 (提前执行避免闪烁)
        (function() {
            const stored = localStorage.getItem('easynotes-theme') || 'auto';
            const resolved = stored === 'auto'
                ? (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')
                : stored;
            document.documentElement.setAttribute('data-theme', resolved);
        })();
    </script>
</head>
<body>
    <button class="theme-toggle" id="theme-toggle" title="切换主题">☀</button>
    <div class="login-container">
        <div class="brand-area">
            <div class="brand-logo">📝</div>
            <div class="brand-name">EasyNotes</div>
            <div class="brand-tagline">简洁安全的笔记编辑器</div>
        </div>

        <div class="login-card">
            <h2>登录到 EasyNotes</h2>
            <form id="login-form" autocomplete="on">
                <div class="form-group">
                    <label for="username">用户名</label>
                    <input type="text" id="username" name="username" placeholder="请输入用户名" autocomplete="username" required>
                </div>
                <div class="form-group">
                    <label for="password">密码</label>
                    <input type="password" id="password" name="password" placeholder="请输入密码" autocomplete="current-password" required>
                </div>
                <button type="submit" class="login-button" id="login-btn">登录</button>
                <div class="error-message" id="error-msg"></div>
            </form>
        </div>

        <div class="footer-text">EasyNotes · 安全可靠的笔记管理</div>
    </div>

    <script src="/assets/js/login.js"></script>
</body>
</html>
